name: CI
# Fits GitHub Free for a private repository (2,000 Actions minutes a month): a newer push cancels
# the run it replaces and a stuck run stops after 20 minutes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    # Set the repository variable CI_RUNNER to "self-hosted" to run on your own machine, which costs
    # no Actions minutes. Default: GitHub's runner. The tests start their own throwaway MongoDB
    # replica set (mongodb-memory-server downloads MongoDB once; the cache below keeps it).
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
